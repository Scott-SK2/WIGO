openapi: 3.0.3
info:
  title: WIGO API
  version: 1.0.0
  description: API publique et organisateurs de WIGO — Trouve ta prochaine sortie.
paths:
  /api/v1/admin/audit:
    get:
      operationId: admin_audit_list
      description: GET /api/v1/admin/audit — journal (ADM-05), réservé aux administrateurs.
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/claims:
    get:
      operationId: admin_claims_list
      description: GET /api/v1/admin/claims — revendications en attente (CAT-03).
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/admin/claims/{id}/decide:
    post:
      operationId: admin_claims_decide_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/admin/imports:
    get:
      operationId: admin_imports_list
      description: GET/POST /api/v1/admin/imports — sources partenaires et déclenchement
        (CAT-02).
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportSource'
          description: ''
    post:
      operationId: admin_imports_create
      description: GET/POST /api/v1/admin/imports — sources partenaires et déclenchement
        (CAT-02).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportTriggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportTriggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportTriggerRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/admin/moderation:
    get:
      operationId: admin_moderation_list
      description: GET /api/v1/admin/moderation — file « À valider » ; POST — décision
        (ADM-01, ADM-02).
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: PENDING_REVIEW (défaut) | CHANGES_REQUESTED | REJECTED | PUBLISHED
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModerationQueueItem'
          description: ''
    post:
      operationId: admin_moderation_create
      description: GET /api/v1/admin/moderation — file « À valider » ; POST — décision
        (ADM-01, ADM-02).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationQueueItem'
          description: ''
  /api/v1/admin/moderation/reasons:
    get:
      operationId: admin_moderation_reasons_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
          description: ''
  /api/v1/admin/reports:
    get:
      operationId: admin_reports_list
      description: GET /api/v1/admin/reports — signalements ouverts.
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
          description: ''
  /api/v1/admin/reports/{id}/decide:
    post:
      operationId: admin_reports_decide_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
  /api/v1/admin/selection:
    get:
      operationId: admin_selection_retrieve
      description: GET/POST /api/v1/admin/selection — sélection du week-end (ADM-09).
      parameters:
      - in: query
        name: week_start
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
          description: ''
    post:
      operationId: admin_selection_create
      description: GET/POST /api/v1/admin/selection — sélection du week-end (ADM-09).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectionWriteRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
          description: ''
  /api/v1/admin/stats:
    get:
      operationId: admin_stats_retrieve
      description: GET /api/v1/admin/stats — tableau KPI (ANA-01, §2.5).
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/areas:
    get:
      operationId: areas_list
      description: GET /api/v1/areas — communes et quartiers.
      tags:
      - areas
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: 'AUTH-03 : paire de jetons (access 15 min, refresh 14 j avec rotation).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'Révocation de la session : le refresh token est mis sur liste
        noire.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      description: 'AUTH-05 / AUTH-06 : profil, suppression du compte (anonymisation).'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    put:
      operationId: auth_me_update
      description: 'AUTH-05 / AUTH-06 : profil, suppression du compte (anonymisation).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: 'AUTH-05 / AUTH-06 : profil, suppression du compte (anonymisation).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: auth_me_destroy
      description: 'AUTH-05 / AUTH-06 : profil, suppression du compte (anonymisation).'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/export:
    get:
      operationId: auth_me_export_retrieve
      description: 'AUTH-06 / RG-18 : export des données personnelles (JSON).'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      description: 'AUTH-04 : demande de réinitialisation (réponse identique que l''e-mail
        existe ou non).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: 'AUTH-01 : inscription par e-mail, envoi du lien de vérification
        (RG-02).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/resend-verification:
    post:
      operationId: auth_resend_verification_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      description: 'AUTH-02 : consommation du jeton de vérification.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/categories:
    get:
      operationId: categories_list
      description: GET /api/v1/categories — taxonomie complète (liste plate avec parent).
      tags:
      - categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/events:
    get:
      operationId: events_list
      description: GET /api/v1/events (recherche publique) et POST /api/v1/events
        (brouillon organisateur).
      parameters:
      - in: query
        name: accessible
        schema:
          type: boolean
        description: Accès PMR
      - in: query
        name: after
        schema:
          type: string
        description: Heure de début minimale (ex. 18)
      - in: query
        name: area
        schema:
          type: string
        description: Slug de commune ou de quartier
      - in: query
        name: category
        schema:
          type: string
        description: Slug de catégorie (inclut les sous-catégories)
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
        description: today | tomorrow | weekend | AAAA-MM-JJ
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: family
        schema:
          type: boolean
        description: En famille
      - in: query
        name: format
        schema:
          type: string
        description: ONSITE | ONLINE | HYBRID
      - in: query
        name: free
        schema:
          type: boolean
      - in: query
        name: include_online
        schema:
          type: boolean
        description: 'Inclure les événements en ligne (défaut : non)'
      - in: query
        name: lang
        schema:
          type: string
        description: fr | nl | en
      - in: query
        name: lat
        schema:
          type: number
          format: double
      - in: query
        name: lon
        schema:
          type: number
          format: double
      - in: query
        name: max_price
        schema:
          type: number
          format: double
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: paid
        schema:
          type: boolean
      - in: query
        name: q
        schema:
          type: string
        description: Recherche texte (titre, description, tags, organisateur, lieu)
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
      - in: query
        name: sort
        schema:
          type: string
        description: relevance | date | distance
      tags:
      - events
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventCard'
          description: ''
    post:
      operationId: events_create
      description: GET /api/v1/events (recherche publique) et POST /api/v1/events
        (brouillon organisateur).
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOwner'
          description: ''
  /api/v1/events/{id}:
    get:
      operationId: events_retrieve
      description: |-
        POST   /api/v1/events                brouillon (RG-02 : e-mail vérifié)
        GET    /api/v1/events/mine           mes événements (tous statuts)
        GET    /api/v1/events/{id}           vue organisateur
        PATCH  /api/v1/events/{id}           édition (RG-11 pour les modifications importantes)
        DELETE /api/v1/events/{id}           suppression d'un brouillon
        POST   /api/v1/events/{id}/submit | /cancel | /confirm
        GET    /api/v1/events/{id}/stats
        POST   /api/v1/events/{id}/media     upload d'un visuel ; DELETE /media/{media_id}
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOwner'
          description: ''
    patch:
      operationId: events_partial_update
      description: |-
        POST   /api/v1/events                brouillon (RG-02 : e-mail vérifié)
        GET    /api/v1/events/mine           mes événements (tous statuts)
        GET    /api/v1/events/{id}           vue organisateur
        PATCH  /api/v1/events/{id}           édition (RG-11 pour les modifications importantes)
        DELETE /api/v1/events/{id}           suppression d'un brouillon
        POST   /api/v1/events/{id}/submit | /cancel | /confirm
        GET    /api/v1/events/{id}/stats
        POST   /api/v1/events/{id}/media     upload d'un visuel ; DELETE /media/{media_id}
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventWriteRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWrite'
          description: ''
    delete:
      operationId: events_destroy
      description: |-
        POST   /api/v1/events                brouillon (RG-02 : e-mail vérifié)
        GET    /api/v1/events/mine           mes événements (tous statuts)
        GET    /api/v1/events/{id}           vue organisateur
        PATCH  /api/v1/events/{id}           édition (RG-11 pour les modifications importantes)
        DELETE /api/v1/events/{id}           suppression d'un brouillon
        POST   /api/v1/events/{id}/submit | /cancel | /confirm
        GET    /api/v1/events/{id}/stats
        POST   /api/v1/events/{id}/media     upload d'un visuel ; DELETE /media/{media_id}
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/events/{id}/back-to-draft:
    post:
      operationId: events_back_to_draft_create
      description: |-
        POST   /api/v1/events                brouillon (RG-02 : e-mail vérifié)
        GET    /api/v1/events/mine           mes événements (tous statuts)
        GET    /api/v1/events/{id}           vue organisateur
        PATCH  /api/v1/events/{id}           édition (RG-11 pour les modifications importantes)
        DELETE /api/v1/events/{id}           suppression d'un brouillon
        POST   /api/v1/events/{id}/submit | /cancel | /confirm
        GET    /api/v1/events/{id}/stats
        POST   /api/v1/events/{id}/media     upload d'un visuel ; DELETE /media/{media_id}
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        required: true
      tags:
      - events
