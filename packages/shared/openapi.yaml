components:
  schemas:
    AgePolicyEnum:
      enum:
      - ALL
      - MIN_AGE
      - ADULTS_ONLY
      type: string
      description: |-
        * `ALL` - Tout public
        * `MIN_AGE` - Dès N ans
        * `ADULTS_ONLY` - 18+
    Area:
      type: object
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        kind:
          $ref: '#/components/schemas/AreaKindEnum'
        name:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        parent:
          type: string
          readOnly: true
        postal_codes:
          type: array
          items:
            type: string
          readOnly: true
        centroid:
          allOf:
          - $ref: '#/components/schemas/LatLonField'
          nullable: true
          readOnly: true
      required:
      - centroid
      - kind
      - name
      - parent
      - postal_codes
      - slug
    AreaKindEnum:
      enum:
      - REGION
      - MUNICIPALITY
      - NEIGHBOURHOOD
      type: string
      description: |-
        * `REGION` - Région
        * `MUNICIPALITY` - Commune
        * `NEIGHBOURHOOD` - Quartier
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 60
        target_type:
          type: string
          maxLength: 60
        target_id:
          type: string
          maxLength: 64
        before: {}
        after: {}
        note:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        parent:
          type: string
          readOnly: true
        icon:
          type: string
          description: Nom d'icône du design system
          maxLength: 40
        order:
          type: integer
          maximum: 32767
          minimum: 0
        is_launch_niche:
          type: boolean
          description: 'Niche de lancement (§2.3) : alimentation active'
      required:
      - name
      - parent
      - slug
    CategoryEnum:
      enum:
      - SPAM
      - ILLEGAL
      - HATE
      - WRONG_INFO
      - DUPLICATE
      - RIGHTS
      - SUSPICIOUS_LINK
      - OTHER
      type: string
      description: |-
        * `SPAM` - Spam ou publicité déguisée
        * `ILLEGAL` - Contenu illégal
        * `HATE` - Discrimination ou haine
        * `WRONG_INFO` - Informations fausses ou périmées
        * `DUPLICATE` - Doublon
        * `RIGHTS` - Droits d'auteur / image
        * `SUSPICIOUS_LINK` - Lien suspect
        * `OTHER` - Autre
    CategoryMini:
      type: object
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        icon:
          type: string
          description: Nom d'icône du design system
          maxLength: 40
      required:
      - name
      - slug
    Claim:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        evidence:
          type: string
          description: E-mail de domaine, contact officiel, preuve…
        status:
          allOf:
          - $ref: '#/components/schemas/ClaimStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - evidence
      - id
      - status
