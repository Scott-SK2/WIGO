name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: wigo
          POSTGRES_USER: wigo
          POSTGRES_PASSWORD: wigo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wigo" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgis://wigo:wigo@localhost:5432/wigo
      DJANGO_SETTINGS_MODULE: wigo.settings.test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système GeoDjango
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer
        run: uv venv && uv pip install -r pyproject.toml --extra dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations à jour
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest -q --no-reuse-db
      - name: Schéma OpenAPI valide
        run: uv run python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn || uv run python manage.py spectacular --file /tmp/openapi.yaml --validate

  web:
    name: Web — lint, types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wigo/web lint
      - run: pnpm --filter @wigo/web typecheck
      - run: pnpm --filter @wigo/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
