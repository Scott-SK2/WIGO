[project]
name = "wigo-api"
version = "0.1.0"
description = "WIGO API — Django + DRF + PostGIS"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.2",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-filter>=24.3",
  "drf-spectacular>=0.27",
  "django-cors-headers>=4.6",
  "django-environ>=0.11",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "django-storages[s3]>=1.14",
  "Pillow>=11.0",
  "argon2-cffi>=23.1",
  "gunicorn>=23.0",
  "whitenoise>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "ruff>=0.7",
  "freezegun>=1.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wigo.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"core/management/commands/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wigo", "accounts", "organizations", "catalog", "events", "moderation", "engagement", "core"]

[tool.uv]
package = false
